<!doctype html>
<html lang="{% if page.lang %}{{ page.lang | replace: '_', '-' | split: '-' | first }}{% else %}en{% endif %}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f2945" />
    <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      sizes="128x128"
      href="{{ '/images/logo-128.png' | relative_url }}"
    />
    <link rel="apple-touch-icon" sizes="180x180" href="{{ '/images/apple-touch-icon.png' | relative_url }}" />
    <link rel="manifest" href="{{ '/site.webmanifest' | relative_url }}" />
    {% if page.noindex %}
    <meta name="robots" content="noindex, nofollow" />
    {% endif %}
    {% seo %}
    {% render "schema", site: site, page: page %}
    {% feed_meta %}
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{% asset_path css %}" />
  </head>
  <body class="bg-glacier-white text-glacier-text antialiased">
    <a href="#main-content" class="skip-link">Skip to content</a>
    {{ content }}
    <script
      defer
      src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/js/all.min.js"
    ></script>
    <script src="{% asset_path js %}" defer></script>
  </body>
</html>
