<!doctype html>
<html lang="{% if page.lang %}{{ page.lang | replace: '_', '-' | split: '-' | first }}{% else %}en{% endif %}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f2945" />
    <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      sizes="128x128"
      href="{{ '/images/logo-128.png' | relative_url }}"
    />
    <link rel="apple-touch-icon" sizes="180x180" href="{{ '/images/apple-touch-icon.png' | relative_url }}" />
    <link rel="manifest" href="{{ '/site.webmanifest' | relative_url }}" />
    {% if page.noindex %}
    <meta name="robots" content="noindex, nofollow" />
    {% endif %}
    {% seo %}
    {% render "schema", site: site, page: page %}
    {% feed_meta %}
    <link
      rel="preload"
      href="{{ '/fonts/inter-latin.woff2' | relative_url }}"
      as="font"
      type="font/woff2"
      crossorigin
    />
    {% if page.relative_url == "/" %}
    <link
      rel="preload"
      href="{{ '/images/glacier.webp' | relative_url }}"
      as="image"
      fetchpriority="high"
    />
    {% endif %}
    <link rel="stylesheet" href="{% asset_path css %}" />
  </head>
  <body class="bg-glacier-white text-glacier-text antialiased">
    <a href="#main-content" class="skip-link">Skip to content</a>
    {{ content }}
    <script src="{% asset_path js %}" defer></script>
  </body>
</html>
