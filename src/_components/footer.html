<footer class="site-footer">
  <div class="mx-auto max-w-5xl px-4 sm:px-6 lg:px-8 py-8">
    <div class="flex flex-col gap-6 md:flex-row md:items-center md:justify-between">
      <p class="text-glacier-muted text-sm">&copy; {{ "now" | date: "%Y" }} {{ site.metadata.title }}. All rights reserved.</p>

      <div class="flex flex-wrap items-center gap-1">
        <nav class="flex flex-wrap items-center gap-1" aria-label="Footer">
          <a class="footer-nav-link" href="{{ '/posts/' | relative_url }}">Blog</a>
          <a class="footer-nav-link" href="{{ '/stories/' | relative_url }}">Stories</a>
          <a class="footer-nav-link" href="{{ '/about/' | relative_url }}">About</a>
        </nav>

        <div class="ml-2 flex items-center gap-1 border-l border-glacier-border pl-2">
          <a href="https://github.com/{{ site.metadata.social.github }}" class="footer-social-link" aria-label="GitHub" rel="me">
            <span class="fab fa-github text-lg" aria-hidden="true"></span>
          </a>
          <a href="https://x.com/{{ site.metadata.social.twitter }}" class="footer-social-link" aria-label="X (Twitter)" rel="me">
            <span class="fab fa-twitter text-lg" aria-hidden="true"></span>
          </a>
          <a href="https://www.linkedin.com/in/{{ site.metadata.social.linkedin }}" class="footer-social-link" aria-label="LinkedIn" rel="me">
            <span class="fab fa-linkedin text-lg" aria-hidden="true"></span>
          </a>
          <a href="{{ '/feed.xml' | relative_url }}" class="footer-social-link" aria-label="RSS feed">
            <span class="fas fa-rss text-lg" aria-hidden="true"></span>
          </a>

      </div>
    </div>
