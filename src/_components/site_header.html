<header class="site-header">
  <div class="mx-auto max-w-5xl px-4 sm:px-6 lg:px-8">
    <div class="flex h-16 items-center justify-between">
      <a href="{{ '/' | relative_url }}" class="flex items-center gap-3">
        <img
          class="h-10 w-10 rounded-full border-2 border-columbia-blue"
          src="{{ '/images/avatar.png' | relative_url }}"
          width="40"
          height="40"
          alt="{{ site.metadata.author.name | default: site.metadata.title }}"
          fetchpriority="high"
        >
        <span class="text-xl font-bold tracking-tight text-white">{{ site.metadata.title }}</span>
      </a>

      <nav class="hidden md:block" aria-label="Primary">
        <div class="ml-10 flex items-baseline gap-1">
          <a
            href="{{ '/' | relative_url }}"
            class="site-nav-link{% if current == 'home' %} is-active{% endif %}"
            {% if current == 'home' %}aria-current="page"{% endif %}
          >Home</a>
          <a
            href="{{ '/posts/' | relative_url }}"
            class="site-nav-link{% if current == 'blog' %} is-active{% endif %}"
            {% if current == 'blog' %}aria-current="page"{% endif %}
          >Blog</a>
          <a
            href="{{ '/stories/' | relative_url }}"
            class="site-nav-link{% if current == 'stories' %} is-active{% endif %}"
            {% if current == 'stories' %}aria-current="page"{% endif %}
          >Stories</a>
          <a
            href="{{ '/about/' | relative_url }}"
            class="site-nav-link{% if current == 'about' %} is-active{% endif %}"
            {% if current == 'about' %}aria-current="page"{% endif %}
          >About</a>
        </div>
      </nav>

      <div class="md:hidden">
        <button
          id="mobile-menu-btn"
          class="mobile-menu-btn"
          type="button"
          aria-expanded="false"
          aria-controls="mobile-menu"
          aria-label="Open navigation"
        >
          <i class="fas fa-bars text-xl" data-menu-icon aria-hidden="true"></i>
        </button>
      </div>
    </div>
  </div>

  <div id="mobile-menu" class="hidden md:hidden bg-oxford-blue">
    <nav class="px-2 pt-2 pb-3 space-y-1 sm:px-3" aria-label="Mobile">
      <a
        href="{{ '/' | relative_url }}"
        class="mobile-nav-link{% if current == 'home' %} is-active{% endif %}"
        {% if current == 'home' %}aria-current="page"{% endif %}
      >Home</a>
      <a
        href="{{ '/posts/' | relative_url }}"
        class="mobile-nav-link{% if current == 'blog' %} is-active{% endif %}"
        {% if current == 'blog' %}aria-current="page"{% endif %}
      >Blog</a>
      <a
        href="{{ '/stories/' | relative_url }}"
        class="mobile-nav-link{% if current == 'stories' %} is-active{% endif %}"
        {% if current == 'stories' %}aria-current="page"{% endif %}
      >Stories</a>
      <a
        href="{{ '/about/' | relative_url }}"
        class="mobile-nav-link{% if current == 'about' %} is-active{% endif %}"
        {% if current == 'about' %}aria-current="page"{% endif %}
      >About</a>
    </nav>
  </div>
</header>
