url: "https://ezcurdia.dev"
lang: es-MX

# Jekyll's default permalink style is "date"; Bridgetown's is "pretty".
# Keep Jekyll's so post URLs stay /YYYY/MM/DD/slug.html
permalink: date

# Jekyll sets kramdown's syntax_highlighter_opts.default_lang to "plaintext"
# (see Jekyll's KramdownParser#setup); without it, language-less code blocks
# lose their language-plaintext classes and differ from the previous output.
kramdown:
  syntax_highlighter_opts:
    default_lang: plaintext

collections:
  stories:
    output: true
    permalink: "/stories/:slug/"

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      image:
        path: /images/og-default.jpg
        alt: "Luis Ezcurdia — software engineering blog"
        width: 1200
        height: 630
  - scope:
      path: ""
      type: stories
    values:
      layout: story
      image:
        path: /images/og-default.jpg
        alt: "Luis Ezcurdia — short stories"
        width: 1200
        height: 630
  - scope:
      path: ""
      type: pages
    values:
      image:
        path: /images/og-default.jpg
        alt: "Luis Ezcurdia — software engineering blog"
        width: 1200
        height: 630
